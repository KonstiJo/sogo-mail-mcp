[project]
name = "sogo-mail-mcp"
version = "0.2.0"
description = "Local MCP server for SOGo / IMAP mailboxes: search, read, draft, flag and organise mail from Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]
keywords = ["mcp", "model-context-protocol", "imap", "sogo", "email", "claude"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
